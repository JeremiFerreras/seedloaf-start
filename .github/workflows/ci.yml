name: Pruebas Seedloaf Start

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
      - "requirements.txt"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validar sintaxis de Python
        run: python -m compileall -q src tests
      - name: Pruebas sin acceso a Seedloaf
        run: python -m unittest discover -s tests -v

      - name: Instalar dependencias del navegador
        run: python -m pip install -r requirements.txt
      - name: Probar Chrome headless sin contactar Seedloaf
        run: |
          python - <<'PY'
          from selenium import webdriver
          opts = webdriver.ChromeOptions()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          with webdriver.Chrome(options=opts) as driver:
              driver.get('data:text/html,<title>Smoke test</title><h1>OK</h1>')
              assert driver.title == 'Smoke test'
          print('Navegador listo')
          PY
