name: Pruebas Seedloaf Start

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
      - "requirements.txt"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar sintaxis de Python
        run: python -m compileall -q src tests
      - name: Pruebas sin acceso a Seedloaf
        run: python -m unittest discover -s tests -v
