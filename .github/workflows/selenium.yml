name: Encender Seedloaf

# Este workflow solo se ejecuta bajo peticion explicita.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/selenium.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seedloaf-start-${{ github.repository }}
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Instalar Selenium
        run: python -m pip install -r requirements.txt

      - name: Verificar secrets sin imprimirlos
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SEEDLOAF_SERVER_ID: ${{ secrets.SEEDLOAF_SERVER_ID }}
        run: |
          test -n "$USERNAME" || { echo "::error::Falta secret USERNAME"; exit 1; }
          test -n "$PASSWORD" || { echo "::error::Falta secret PASSWORD"; exit 1; }
          test -n "$SEEDLOAF_SERVER_ID" || { echo "::error::Falta secret SEEDLOAF_SERVER_ID"; exit 1; }

      - name: Pedir inicio de servidor
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SEEDLOAF_SERVER_ID: ${{ secrets.SEEDLOAF_SERVER_ID }}
        run: python src/seedloaf_start.py
