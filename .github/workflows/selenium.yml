name: Encender Seedloaf

# Este workflow solo se ejecuta bajo peticion explicita.
on:
  workflow_dispatch:
    inputs:
      check_only:
        description: "Solo comprobar estado (no pulsar Start)"
        required: false
        type: boolean
        default: false
      backend:
        description: "browser actual o API oficial verificada (si Seedloaf la publica)"
        required: false
        type: choice
        default: browser
        options:
          - browser
          - browser_cdp
          - official_api

permissions:
  contents: read

concurrency:
  group: seedloaf-start-${{ github.repository }}
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Preparar DNS SRV de Minecraft
        run: python -m pip install --disable-pip-version-check dnspython==2.8.0

      - name: Comprobar Minecraft antes del navegador
        id: preflight
        env:
          MINECRAFT_ADDRESS: ${{ secrets.MINECRAFT_ADDRESS }}
        run: python src/fastcheck.py

      - name: Instalar SeleniumBase UC (solo si hace falta)
        if: ${{ steps.preflight.outputs.online != 'true' && (inputs.backend == 'browser' || inputs.backend == 'browser_cdp' || inputs.backend == '') }}
        run: python -m pip install -r requirements.txt

      - name: Verificar configuracion sin imprimir secretos
        if: ${{ steps.preflight.outputs.online != 'true' }}
        env:
          START_BACKEND: ${{ inputs.backend || 'browser' }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SEEDLOAF_SERVER_ID: ${{ secrets.SEEDLOAF_SERVER_ID }}
          MINECRAFT_ADDRESS: ${{ secrets.MINECRAFT_ADDRESS }}
          SEEDLOAF_OFFICIAL_STATUS_URL: ${{ secrets.SEEDLOAF_OFFICIAL_STATUS_URL }}
          SEEDLOAF_OFFICIAL_START_URL: ${{ secrets.SEEDLOAF_OFFICIAL_START_URL }}
          SEEDLOAF_OFFICIAL_API_TOKEN: ${{ secrets.SEEDLOAF_OFFICIAL_API_TOKEN }}
        run: |
          test -n "$SEEDLOAF_SERVER_ID" || { echo "::error::Falta SEEDLOAF_SERVER_ID"; exit 1; }
          if [ "$START_BACKEND" = "browser" ] || [ "$START_BACKEND" = "browser_cdp" ]; then
            test -n "$USERNAME" || { echo "::error::Falta USERNAME"; exit 1; }
            test -n "$PASSWORD" || { echo "::error::Falta PASSWORD"; exit 1; }
          elif [ "$START_BACKEND" = "official_api" ]; then
            test -n "$SEEDLOAF_OFFICIAL_STATUS_URL" || { echo "::error::Falta URL oficial de estado"; exit 1; }
            test -n "$SEEDLOAF_OFFICIAL_START_URL" || { echo "::error::Falta URL oficial de inicio"; exit 1; }
            test -n "$SEEDLOAF_OFFICIAL_API_TOKEN" || { echo "::error::Falta token oficial de API"; exit 1; }
          else
            echo "::error::START_BACKEND desconocido"; exit 1
          fi

      - name: Encender mediante el backend elegido
        if: ${{ steps.preflight.outputs.online != 'true' }}
        env:
          START_BACKEND: ${{ inputs.backend || 'browser' }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SEEDLOAF_SERVER_ID: ${{ secrets.SEEDLOAF_SERVER_ID }}
          MINECRAFT_ADDRESS: ${{ secrets.MINECRAFT_ADDRESS }}
          SEEDLOAF_OFFICIAL_STATUS_URL: ${{ secrets.SEEDLOAF_OFFICIAL_STATUS_URL }}
          SEEDLOAF_OFFICIAL_START_URL: ${{ secrets.SEEDLOAF_OFFICIAL_START_URL }}
          SEEDLOAF_OFFICIAL_API_TOKEN: ${{ secrets.SEEDLOAF_OFFICIAL_API_TOKEN }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: python src/entrypoint.py
